<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子訊息 APP - 字字分明修正版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #040406;
            color: #ffffff;
            font-family: "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* 頂部動態劇院舞台 */
        #stage-container {
            flex: 1;
            position: relative;
            background: #000000;
            overflow: hidden;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 畫布寬高自適應拉伸，底層保持高畫質解析度 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 頂部浮動提示 */
        #ui-tip {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.75);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: #a1a1aa;
            pointer-events: none;
            transition: opacity 0.4s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            z-index: 150;
        }

        /* 下方多功能控制面板 */
        #control-panel {
            background-color: #0b0b0f;
            padding: 18px;
            border-top: 1px solid #161622;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 隱藏 UI 狀態 */
        body.hide-ui #control-panel {
            transform: translateY(100%);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
        }
        body.hide-ui #ui-tip {
            opacity: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            height: 75px;
            background-color: #12121a;
            border: 1px solid #1f1f2e;
            border-radius: 8px;
            color: #ffffff;
            padding: 10px 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }

        .settings-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #00ffcc;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="color"], input[type="number"], select {
            background-color: #12121a;
            border: 1px solid #1f1f2e;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
        }

        input[type="color"] {
            width: 36px;
            height: 32px;
            padding: 2px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 260px;
        }

        button {
            flex: 1;
            border: none;
            border-radius: 8px;
            color: white;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-play { background: linear-gradient(135deg, #6200ee, #3700b3); }
        .btn-record { background: linear-gradient(135deg, #ff3b30, #b30000); }
        .btn-share { background: linear-gradient(135deg, #007aff, #004094); }
        .btn-toggle-ui { background: #2c2c2e; color: #aeaeb2; flex: 0 0 auto; }

        button:active { transform: scale(0.97); }

        #recording-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 59, 48, 0.95);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            align-items: center;
            gap: 6px;
            animation: pulse-red 1.5s infinite;
            z-index: 200;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.5);
        }

        @keyframes pulse-red {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="stage-container">
        <div id="ui-tip">💡 點擊螢幕任意空白處，可隱藏/顯示下方控制面板</div>
        <div id="recording-badge">🔴 高清高位元率錄影中...</div>
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="control-panel">
        <div class="input-group">
            <label for="message-input">多行訊息輸入：</label>
            <textarea id="message-input" placeholder="請輸入訊息...">美
讚
拍得好</textarea>
        </div>

        <div class="settings-row">
            <div class="setting-item">
                <label for="text-font">字型：</label>
                <select id="text-font">
                    <option value='"PingFang TC", "Microsoft JhengHei", sans-serif'>粗黑體</option>
                    <option value='"STSong", "PMingLiU", serif'>仿宋體</option>
                </select>
            </div>
            
            <div class="setting-item">
                <label for="text-color">顏色：</label>
                <input type="color" id="text-color" value="#ff2a6d">
            </div>

            <div class="checkbox-item">
                <input type="checkbox" id="include-time-check" checked>
                <label for="include-time-check" style="color:#00ffcc; cursor:pointer;">📅 加上今日時間</label>
            </div>

            <div class="setting-item">
                <label for="speed-input">出字(ms)：</label>
                <input type="number" id="speed-input" value="1000" min="200" max="3000" step="100" style="width: 65px;">
            </div>

            <div class="btn-group">
                <button class="btn-play" id="play-btn">▶ 播放</button>
                <button class="btn-record" id="record-btn">🎥 錄製影片</button>
                <button class="btn-share" id="share-btn">🔗 傳送網址</button>
                <button class="btn-toggle-ui" id="ui-btn">👁‍角</button>
            </div>
        </div>
    </div>

    <canvas id="memoryCanvas" style="display: none;"></canvas>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const memCanvas = document.getElementById('memoryCanvas');
        const memCtx = memCanvas.getContext('2d', { willReadFrequently: true });

        const stageContainer = document.getElementById('stage-container');
        const messageInput = document.getElementById('message-input');
        const textColorInput = document.getElementById('text-color');
        const fontSelect = document.getElementById('text-font');
        const speedInput = document.getElementById('speed-input');
        const includeTimeCheck = document.getElementById('include-time-check');
        
        const playBtn = document.getElementById('play-btn');
        const recordBtn = document.getElementById('record-btn');
        const shareBtn = document.getElementById('share-btn');
        const uiBtn = document.getElementById('ui-btn');
        const recordingBadge = document.getElementById('recording-badge');

        // 鎖定物理畫布尺寸（拉高解析度，確保錄影顆粒精準）
        const BASE_WIDTH = 1080;
        const BASE_HEIGHT = 1920;

        let particles = [];
        let textLines = [];
        let currentLineIndex = 0;
        let carouselTimer = null;
        let phase = "gather"; // "gather" 聚集, "explode" 爆散, "turbulent" 漩渦擾動
        let phaseTimer = 0;

        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];

        // 數字轉中文的對照表，徹底消滅狹窄的英文數字
        const numToChan = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];

        function toChineseNumString(numStr) {
            return numStr.split('').map(char => {
                if (char >= '0' && char <= '9') {
                    return numToChan[parseInt(char)];
                }
                return char;
            }).join('');
        }

        // 智慧型時間中文化轉換器（保證字體結構寬大分明）
        function getChineseDateTimeStrings() {
            const now = new Date();
            const year = now.getFullYear().toString();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');

            const chineseYear = toChineseNumString(year);
            const chineseMonth = toChineseNumString(month);
            const chineseDay = toChineseNumString(day);
            const chineseHours = toChineseNumString(hours);
            const chineseMinutes = toChineseNumString(minutes);

            return [
                `${chineseYear}年${chineseMonth}月${chineseDay}日`,
                `${chineseHours}點${chineseMinutes}分`
            ];
        }

        function initCanvasSize() {
            canvas.width = BASE_WIDTH;
            canvas.height = BASE_HEIGHT;
            memCanvas.width = BASE_WIDTH;
            memCanvas.height = BASE_HEIGHT;
        }

        // 初始化粒子池（5000個常駐粒子，防止動態增刪造成記憶體崩潰與抖動變形）
        function initParticlePool() {
            particles = [];
            for (let i = 0; i < 5200; i++) {
                particles.push({
                    x: Math.random() * BASE_WIDTH,
                    y: Math.random() * BASE_HEIGHT,
                    targetX: Math.random() * BASE_WIDTH,
                    targetY: Math.random() * BASE_HEIGHT,
                    vx: 0,
                    vy: 0,
                    size: 1.8 + Math.random() * 1.5, // 粒子稍微放大，提升顆粒質感
                    alpha: 0.1 + Math.random() * 0.8,
                    active: false,
                    color: '#ffffff'
                });
            }
        }

        // 核心修正：採樣文字像素地圖
        function sampleTextMap(text, isTimeLine = false) {
            memCtx.clearRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
            
            // 根據是否為時間，給予字體最安全的清晰尺寸
            let fSize = isTimeLine ? 72 : 92; 
            memCtx.font = `900 ${fSize}px ${fontSelect.value}`;
            memCtx.fillStyle = "#ffffff";
            memCtx.textAlign = "center";
            memCtx.textBaseline = "middle";

            // 計算滿寬縮放，確保文字撐滿直式螢幕
            const metrics = memCtx.measureText(text);
            const targetWidth = BASE_WIDTH * 0.88;
            if (metrics.width > 0) {
                const scaleFactor = targetWidth / metrics.width;
                let finalSize = Math.min(fSize * scaleFactor, 180); // 限制上限防溢出
                if(finalSize < 45) finalSize = 45; // 限制下限防過小黏糊
                memCtx.font = `900 ${finalSize}px ${fontSelect.value}`;
            }

            // 在離屏畫布中央繪製文字
            memCtx.fillText(text, BASE_WIDTH / 2, BASE_HEIGHT / 2);

            // 讀取像素數據
            const imgData = memCtx.getImageData(0, 0, BASE_WIDTH, BASE_HEIGHT);
            const data = imgData.data;
            const targets = [];

            // 採樣步長（顆粒度調校：每隔 5 像素抽樣一次，確保顆粒清晰度，且不黏稠）
            const step = 5; 
            for (let y = 0; y < BASE_HEIGHT; y += step) {
                for (let x = 0; x < BASE_WIDTH; x += step) {
                    const idx = (y * BASE_WIDTH + x) * 4;
                    if (data[idx] > 128) { // 如果像素是白的（有筆畫）
                        targets.push({ x: x, y: y });
                    }
                }
            }

            // 洗牌打亂目標點，讓粒子隨機飛入，視覺效果更自然
            for (let i = targets.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [targets[i], targets[j]] = [targets[j], targets[i]];
            }

            // 將採樣到的座標分派給粒子池
            const chosenColor = textColorInput.value;
            particles.forEach((p, i) => {
                if (i < targets.length) {
                    p.targetX = targets[i].x;
                    p.targetY = targets[i].y;
                    p.active = true;
                    p.color = chosenColor;
                } else {
                    // 多餘的粒子，在背景隨機散開，形成自然的微塵襯底，絕不疊在一起形成糊塊
                    p.active = false;
                    p.targetX = Math.random() * BASE_WIDTH;
                    p.targetY = Math.random() * BASE_HEIGHT;
                }
            });
        }

        function loadTextLine(index) {
            if (textLines.length === 0) return;
            
            phase = "turbulent"; // 先進入1秒的漩渦擾動，讓動作更優雅
            phaseTimer = 0;

            const lineObj = textLines[index];
            sampleTextMap(lineObj.text, lineObj.isTime);
        }

        function startCarousel() {
            if (carouselTimer) clearInterval(carouselTimer);

            // 讀取使用者輸入並建立播放清單
            const rawLines = messageInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            textLines = rawLines.map(t => ({ text: t, isTime: false }));

            // 如果勾選加入時間，智慧置入中文化時間
            if (includeTimeCheck.checked) {
                const timeStrings = getChineseDateTimeStrings();
                textLines.push({ text: timeStrings[0], isTime: true }); // 日期
                textLines.push({ text: timeStrings[1], isTime: true }); // 時間
            }

            if (textLines.length === 0) return;

            currentLineIndex = 0;
            loadTextLine(currentLineIndex);

            const duration = parseInt(speedInput.value) || 1000;
            carouselTimer = setInterval(() => {
                const nextIndex = currentLineIndex + 1;

                if (nextIndex >= textLines.length) {
                    // 如果播完了最後一行
                    if (isRecording) {
                        stopRecordingAndDownload();
                    } else {
                        currentLineIndex = 0;
                        loadTextLine(currentLineIndex);
                    }
                } else {
                    currentLineIndex = nextIndex;
                    loadTextLine(currentLineIndex);
                }
            }, duration + 2000); // 展示停留時間延伸
        }

        // 物理運動運算
        function updateParticles(dt) {
            phaseTimer += dt;
            
            if (phase === "turbulent" && phaseTimer > 800) {
                phase = "gather"; // 0.8秒後收束凝聚
            }

            particles.forEach((p) => {
                if (phase === "turbulent") {
                    // 漩渦擾動期：加入基於正弦波動的風力噪波，讓微粒在半空交織，防止突變黏死
                    const noiseX = Math.sin(p.y * 0.01 + phaseTimer * 0.005) * 4;
                    const noiseY = Math.cos(p.x * 0.01 + phaseTimer * 0.005) * 4;
                    p.vx = p.vx * 0.88 + noiseX;
                    p.vy = p.vy * 0.88 + noiseY;
                } 
                else if (p.active && phase === "gather") {
                    // 凝聚期：高精度的彈性接近物理運動（Easing）
                    const dx = p.targetX - p.x;
                    const dy = p.targetY - p.y;
                    
                    // 防禦重疊：如果距離目標極近，給予極微小的抖動，防止粒子完全疊死在同一像素上
                    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
                        p.vx = (Math.random() - 0.5) * 0.5;
                        p.vy = (Math.random() - 0.5) * 0.5;
                    } else {
                        p.vx = p.vx * 0.82 + dx * 0.07;
                        p.vy = p.vy * 0.82 + dy * 0.07;
                    }
                } 
                else {
                    // 手動爆散或非活躍粒子：阻尼漂流模式
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                }

                p.x += p.vx;
                p.y += p.vy;

                // 邊界防禦
                if (p.x < 0) p.x = 0;
                if (p.x > BASE_WIDTH) p.x = BASE_WIDTH;
                if (p.y < 0) p.y = 0;
                if (p.y > BASE_HEIGHT) p.y = BASE_HEIGHT;
            });
        }

        let lastTime = performance.now();
        function animate(now) {
            const dt = now - lastTime;
            lastTime = now;

            updateParticles(dt);

            // 清除畫布（純黑）
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

            // 繪製粒子
            particles.forEach((p) => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, p.size, p.size); // 使用正方形微粒提升邊緣銳利度，拒絕圓形邊緣發糊
            });
            ctx.globalAlpha = 1.0;

            requestAnimationFrame(animate);
        }

        // 觸碰螢幕手動爆散打散
        stageContainer.addEventListener('click', (e) => {
            if (e.target !== canvas && e.target !== stageContainer) return;
            
            // 如果點擊空白處且非錄影中，切換UI顯示
            if (!isRecording && e.target === stageContainer) {
                document.body.classList.toggle('hide-ui');
                return;
            }

            phase = "explode";
            particles.forEach((p) => {
                const angle = Math.random() * Math.PI * 2;
                const speed = 15 + Math.random() * 25;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
            });

            // 2.5秒後自動重新啟動輪播
            setTimeout(() => {
                if (phase === "explode") startCarousel();
            }, 2500);
        });

        uiBtn.addEventListener('click', () => {
            document.body.classList.toggle('hide-ui');
        });

        playBtn.addEventListener('click', startCarousel);

        // 智慧傳送網址功能
        shareBtn.addEventListener('click', () => {
            const config = {
                text: messageInput.value,
                color: textColorInput.value,
                font: fontSelect.selectedIndex,
                speed: speedInput.value,
                time: includeTimeCheck.checked ? 1 : 0
            };
            const paramStr = encodeURIComponent(JSON.stringify(config));
            const shareUrl = `${window.location.origin}${window.location.pathname}?data=${paramStr}`;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('🚀 收件者純淨版網址已成功複製到您的剪貼簿！可以直接傳給 LINE 朋友囉！');
            }).catch(() => {
                alert(`由於瀏覽器安全限制，請手動全選複製以下網址：\n\n${shareUrl}`);
            });
        });

        // 讀取網址引導參數
        function parseUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            if (dataParam) {
                try {
                    const cfg = JSON.parse(decodeURIComponent(dataParam));
                    messageInput.value = cfg.text;
                    textColorInput.value = cfg.color;
                    fontSelect.selectedIndex = cfg.font || 0;
                    speedInput.value = cfg.speed;
                    includeTimeCheck.checked = cfg.time === 1;
                    
                    // 收件者視角：一律自動隱藏控制面板，給予最純淨的動畫體驗
                    document.body.classList.add('hide-ui');
                } catch (e) {
                    console.error("網址解析有誤", e);
                }
            }
        }

        // 錄影核心控制模組
        recordBtn.addEventListener('click', () => {
            if (isRecording) return;

            // 原生抓取 Canvas 原始高畫質畫面串流 (30 FPS)
            const stream = canvas.captureStream(30);
            
            let codecOption = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(codecOption)) {
                codecOption = 'video/webm;codecs=vp8';
            }

            // 強制灌入 12 Mbps 的超高位元率，保證每一個粒子的邊緣在錄製壓縮時絕對不發糊！
            const recorderOptions = {
                mimeType: codecOption,
                videoBitsPerSecond: 12000000 
            };

            try {
                mediaRecorder = new MediaRecorder(stream, recorderOptions);
            } catch(e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            recordedChunks = [];
            isRecording = true;
            
            document.body.classList.add('hide-ui');
            recordingBadge.style.display = 'flex';
            
            // 從頭重跑一輪
            startCarousel();

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `粒子大字報_${Date.now()}.webm`;
                a.click();
                
                isRecording = false;
                recordingBadge.style.display = 'none';
                document.body.classList.remove('hide-ui');
                alert('🎉 高畫質無損影片錄製完成！已修正字體空間間距，保證清晰不黏膠！');
            };

            mediaRecorder.start();
        });

        function stopRecordingAndDownload() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                if (carouselTimer) clearInterval(carouselTimer);
            }
        }

        // 啟動工作流
        parseUrlParams();
        initCanvasSize();
        initParticlePool();
        startCarousel();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
