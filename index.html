<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訊息傳遞 APP - 高清不變形大字劇院版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #040406;
            color: #ffffff;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* 頂部動態劇院舞台 */
        #stage-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at 85% 80%, #0e0e1a 0%, #010102 100%);
            overflow: hidden;
            width: 100%;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 頂部浮動提示 */
        #ui-tip {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: #a1a1aa;
            pointer-events: none;
            transition: opacity 0.4s;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
        }

        /* 下方多功能控制面板 */
        #control-panel {
            background-color: #0b0b0f;
            padding: 18px;
            border-top: 1px solid #161622;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(0);
        }

        /* 隱藏 UI 狀態（劇院模式） */
        body.hide-ui #control-panel {
            transform: translateY(100%);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
        }
        body.hide-ui #ui-tip {
            opacity: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background-color: #12121a;
            border: 1px solid #1f1f2e;
            border-radius: 8px;
            color: #ffffff;
            padding: 10px 14px;
            font-size: 15px;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }

        .settings-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        input[type="color"], input[type="number"] {
            background-color: #12121a;
            border: 1px solid #1f1f2e;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
        }

        input[type="color"] {
            width: 40px;
            height: 32px;
            padding: 2px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 280px;
        }

        button {
            flex: 1;
            border: none;
            border-radius: 8px;
            color: white;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-play { background: linear-gradient(135deg, #6200ee, #3700b3); box-shadow: 0 4px 10px rgba(98, 0, 238, 0.3); }
        .btn-record { background: linear-gradient(135deg, #ff3b30, #b30000); box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3); }
        .btn-share { background: linear-gradient(135deg, #007aff, #004094); box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3); }
        .btn-toggle-ui { background: #2c2c2e; color: #aeaeb2; flex: 0 0 auto; }

        button:active { transform: scale(0.97); opacity: 0.9; }

        /* 正在錄影指示燈 */
        #recording-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 59, 48, 0.9);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            align-items: center;
            gap: 6px;
            animation: pulse-red 1.5s infinite;
            z-index: 200;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.5);
        }

        @keyframes pulse-red {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="stage-container" title="點擊切換隱藏/顯示操作面板">
        <div id="ui-tip">💡 點擊畫布任意處，可隱藏下方操作面板</div>
        <div id="recording-badge">🔴 16:9 標準比例高清錄影中，請勿關閉網頁...</div>
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="control-panel">
        <div class="input-group">
            <label for="message-input">多行訊息輸入（超大字體、極緩速度、修復錄影變形版）：</label>
            <textarea id="message-input" placeholder="請輸入訊息...">巨型霓虹字體
慢步調 悠閒滑行
標準比例 高清錄製
絕不變形 唯美呈現</textarea>
        </div>

        <div class="settings-row">
            <div class="setting-item">
                <label for="text-color">誕生色：</label>
                <input type="color" id="text-color" value="#00ffcc">
            </div>
            <div class="setting-item">
                <label for="speed-input">字距慢速(ms)：</label>
                <input type="number" id="speed-input" value="900" min="100" max="3000" step="50" style="width: 75px;">
            </div>
            <div class="setting-item">
                <label for="line-gap-input">行停頓(秒)：</label>
                <input type="number" id="line-gap-input" value="3.5" min="0" max="10" step="0.5" style="width: 60px;">
            </div>

            <div class="btn-group">
                <button class="btn-play" id="play-btn">▶ 播放</button>
                <button class="btn-record" id="record-btn">🎥 錄製影片</button>
                <button class="btn-share" id="share-btn">🔗 分享連結</button>
                <button class="btn-toggle-ui" id="ui-btn" title="隱藏面板">👁‍🗨</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const stageContainer = document.getElementById('stage-container');
        const messageInput = document.getElementById('message-input');
        const textColorInput = document.getElementById('text-color');
        const speedInput = document.getElementById('speed-input');
        const lineGapInput = document.getElementById('line-gap-input');
        const playBtn = document.getElementById('play-btn');
        const recordBtn = document.getElementById('record-btn');
        const shareBtn = document.getElementById('share-btn');
        const uiBtn = document.getElementById('ui-btn');
        const recordingBadge = document.getElementById('recording-badge');

        // 用於錄影的標準 16:9 隱藏畫布
        const recordCanvas = document.createElement('canvas');
        const recordCtx = recordCanvas.getContext('2d', { willReadFrequently: true });
        const RECORD_WIDTH = 1280;  // 錄製標準高清寬
        const RECORD_HEIGHT = 720; // 錄製標準高清高

        let particles = [];
        let textLines = [];
        let currentLineIndex = 0;
        let tokenTimeline = [];
        let globalTimer = 0;
        let nextLineUnlockTime = 0;

        let speakerPulses = [];
        let isRecording = false;
        let recordStartCycleIndex = 0;
        let mediaRecorder = null;
        let recordedChunks = [];

        function resizeCanvas() {
            canvas.width = stageContainer.clientWidth * window.devicePixelRatio;
            canvas.height = stageContainer.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);

        function parseTextToTokens(text) {
            const regex = /([A-Za-z0-9'-]+)|(.)/g;
            const tokens = [];
            let match;
            while ((match = regex.exec(text)) !== null) {
                if (match[0].trim() !== '') tokens.push(match[0]);
            }
            return tokens;
        }

        function compileTimeline() {
            particles = [];
            speakerPulses = [];
            textLines = messageInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (textLines.length === 0) return;

            currentLineIndex = 0;
            globalTimer = 0;
            prepareLineTimeline(0);
        }

        function prepareLineTimeline(lineIdx) {
            tokenTimeline = [];
            const tokens = parseTextToTokens(textLines[lineIdx]);
            const interval = parseInt(speedInput.value) || 900;
            const lineGap = parseFloat(lineGapInput.value) * 1000 || 3500;

            let localTime = globalTimer;
            tokens.forEach((tok) => {
                tokenTimeline.push({ time: localTime, token: tok });
                localTime += interval;
            });
            nextLineUnlockTime = localTime + lineGap;
        }

        function spawnToken(text) {
            speakerPulses.push({ r: 32, opacity: 0.8 });

            // 為了確保物理軌跡在錄影時也是 16:9，全部物理計算改用相對比例 (%)
            // 隨機遠離左上角的終點位置百分比
            const destXPct = -(1.2 + Math.random() * 0.4);
            const destYPct = -(1.1 + Math.random() * 0.4);
            const destRotate = (Math.random() * 20 - 10) * Math.PI / 180;

            particles.push({
                text: text,
                rotateDeg: destRotate,
                scale: 0.5,
                opacity: 0,
                life: 8500, // 調慢移動後，生命週期同步延長至 8.5 秒
                startColor: textColorInput.value,
                birthTime: globalTimer,
                destXPct: destXPct,
                destYPct: destYPct
            });
        }

        function interpolateColor(startHex, pct) {
            const hexToRgb = hex => hex.replace(/^#?([a-f\d])([a-f\d])([a-f\d])$/i,(m,r,g,b) => '#' + r + r + g + g + b + b).substring(1).match(/.{2}/g).map(x => parseInt(x, 16));
            const rgbToHex = (r, g, b) => "#" + [r, g, b].map(x => x.toString(16).padStart(2, "0")).join("");

            let c1, c2, localPct;
            const rgbStart = hexToRgb(startHex);
            const rgbCyan = [0, 242, 254];
            const rgbPurple = [155, 81, 224];
            const rgbPink = [255, 0, 127];

            if (pct < 0.35) {
                c1 = rgbStart; c2 = rgbCyan; localPct = pct / 0.35;
            } else if (pct < 0.70) {
                c1 = rgbCyan; c2 = rgbPurple; localPct = (pct - 0.35) / 0.35;
            } else {
                c1 = rgbPurple; c2 = rgbPink; localPct = (pct - 0.70) / 0.30;
            }

            const r = Math.round(c1[0] + (c2[0] - c1[0]) * localPct);
            const g = Math.round(c1[1] + (c2[1] - c1[1]) * localPct);
            const b = Math.round(c1[2] + (c2[2] - c1[2]) * localPct);
            return rgbToHex(r, g, b);
        }

        // 獨立出的通用渲染核心，用來同時繪製「螢幕預覽」與「16:9錄影畫布」，一舉根除拉伸變形問題
        function drawScene(targetCtx, w, h, dt) {
            targetCtx.clearRect(0, 0, w, h);

            const spX = w - 70;
            const spY = h * 0.72;

            // 1. 繪製喇叭波紋
            speakerPulses.forEach((p, idx) => {
                if (targetCtx === ctx) { // 僅在主螢幕更新波紋物理參數，避免雙重疊加
                    p.r += dt * 0.12; // 調慢波紋速度
                    p.opacity -= dt * 0.0015;
                }
                if (p.opacity <= 0) {
                    if (targetCtx === ctx) speakerPulses.splice(idx, 1);
                    return;
                }
                targetCtx.beginPath();
                targetCtx.arc(spX, spY, p.r * (w / stageContainer.clientWidth), 0, Math.PI * 2);
                targetCtx.strokeStyle = `rgba(255, 42, 109, ${p.opacity})`;
                targetCtx.lineWidth = 2;
                targetCtx.stroke();
            });

            // 2. 繪製小喇叭主體
            targetCtx.save();
            targetCtx.beginPath();
            targetCtx.arc(spX, spY, 32 * (w / stageContainer.clientWidth), 0, Math.PI * 2);
            const grad = targetCtx.createLinearGradient(spX-20, spY-20, spX+20, spY+20);
            grad.addColorStop(0, '#7b2cbf');
            grad.addColorStop(1, '#ff2a6d');
            targetCtx.fillStyle = grad;
            targetCtx.shadowBlur = 20;
            targetCtx.shadowColor = 'rgba(255, 42, 109, 0.5)';
            targetCtx.fill();
            
            targetCtx.fillStyle = '#ffffff';
            targetCtx.font = `${26 * (w / stageContainer.clientWidth)}px sans-serif`;
            targetCtx.textAlign = 'center';
            targetCtx.textBaseline = 'middle';
            targetCtx.fillText('📢', spX, spY);
            targetCtx.restore();

            // 3. 繪製文字粒子
            particles.forEach((p) => {
                const age = globalTimer - p.birthTime;
                if (age >= p.life) return;

                const pct = age / p.life;
                // 更平滑、更緩慢的 ease-out 曲線 (四次曲線)
                const slowEaseOut = 1 - Math.pow(1 - pct, 4); 
                
                const curX = spX + (w * p.destXPct) * slowEaseOut;
                const curY = spY + (h * p.destYPct) * slowEaseOut;
                
                // 【字體再調大】：膨脹係數提升至 0.5 到 11.0 倍
                p.scale = 0.5 + (11.0 - 0.5) * pct;

                if (pct < 0.15) {
                    p.opacity = pct / 0.15; // 延長登場淡入，顯得更柔和
                } else if (pct > 0.65) {
                    p.opacity = 1 - (pct - 0.65) / 0.35; // 悠閒淡出
                } else {
                    p.opacity = 0.95;
                }

                const curColor = interpolateColor(p.startColor, pct);

                targetCtx.save();
                targetCtx.translate(curX, curY);
                targetCtx.rotate(p.rotateDeg * pct);
                
                // 同步將動態比例計算套入縮放中
                const dynamicScale = p.scale * (w / stageContainer.clientWidth);
                targetCtx.scale(dynamicScale, dynamicScale);
                
                // 【核心優化】：基礎字型直接加大到 38px，配合 11 倍放大，帶來無與倫比的影院感
                targetCtx.font = 'bold 38px "PingFang TC", "Microsoft JhengHei", sans-serif';
                targetCtx.textAlign = 'center';
                targetCtx.textBaseline = 'middle';
                
                targetCtx.shadowBlur = 25;
                targetCtx.shadowColor = curColor;
                targetCtx.fillStyle = curColor;
                targetCtx.globalAlpha = p.opacity;
                
                targetCtx.fillText(p.text, 0, 0);
                targetCtx.restore();
            });

            // 清理過期粒子（僅在主螢幕迴圈執行一次即可）
            if (targetCtx === ctx) {
                particles = particles.filter(p => (globalTimer - p.birthTime) < p.life);
            }
        }

        let lastTime = performance.now();
        function loop(now) {
            const dt = now - lastTime;
            lastTime = now;

            if (textLines.length > 0) {
                globalTimer += dt;

                while (tokenTimeline.length > 0 && globalTimer >= tokenTimeline[0].time) {
                    const node = tokenTimeline.shift();
                    spawnToken(node.token);
                }

                if (globalTimer >= nextLineUnlockTime) {
                    const nextIndex = (currentLineIndex + 1) % textLines.length;
                    
                    if (isRecording && nextIndex === recordStartCycleIndex) {
                        stopRecordingAndDownload();
                    } else {
                        currentLineIndex = nextIndex;
                        prepareLineTimeline(currentLineIndex);
                    }
                }
            }

            // 1. 繪製可視畫面（適應使用者當前瀏覽器外觀）
            drawScene(ctx, stageContainer.clientWidth, stageContainer.clientHeight, dt);

            // 2. 如果正在錄影，同步精準渲染出一張絕對是 16:9 比例的無變形畫面送入錄製管線
            if (isRecording) {
                drawScene(recordCtx, RECORD_WIDTH, RECORD_HEIGHT, dt);
            }

            requestAnimationFrame(loop);
        }

        function toggleUI() {
            document.body.classList.toggle('hide-ui');
        }
        stageContainer.addEventListener('click', (e) => {
            if(e.target === stageContainer || e.target === canvas) toggleUI();
        });
        uiBtn.addEventListener('click', toggleUI);

        shareBtn.addEventListener('click', () => {
            const config = {
                text: messageInput.value,
                color: textColorInput.value,
                speed: speedInput.value,
                gap: lineGapInput.value
            };
            const base64Data = btoa(encodeURIComponent(JSON.stringify(config)));
            const shareUrl = `${window.location.origin}${window.location.pathname}?msg=${base64Data}`;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('🚀 分享連結已成功複製！對方打開將直接享有完美比例與超慢速大字體特效。');
            }).catch(() => {
                alert(`請手動複製連結：\n${shareUrl}`);
            });
        });

        function parseUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('msg');
            if (encodedData) {
                try {
                    const decodedConfig = JSON.parse(decodeURIComponent(atob(encodedData)));
                    messageInput.value = decodedConfig.text;
                    textColorInput.value = decodedConfig.color;
                    speedInput.value = decodedConfig.speed;
                    lineGapInput.value = decodedConfig.gap;
                    document.body.classList.add('hide-ui');
                } catch (e) {
                    console.error("網址參數解析失敗", e);
                }
            }
        }

        // 【大改版：錄製專用非變形管線】
        recordBtn.addEventListener('click', () => {
            if (isRecording) return;
            
            // 強制設定隱藏錄影畫布尺寸為標準 16:9
            recordCanvas.width = RECORD_WIDTH;
            recordCanvas.height = RECORD_HEIGHT;

            // 從「隱藏的 16:9 標準畫布」中擷取影音流，而非從外面會變形的螢幕擷取
            const stream = recordCanvas.captureStream(30);
            const options = { mimeType: 'video/webm;codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'video/webm;codecs=vp8';
            }

            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch(e) {
                alert('瀏覽器不支援高清錄影系統');
                return;
            }

            recordedChunks = [];
            isRecording = true;
            
            document.body.classList.add('hide-ui');
            recordingBadge.style.display = 'flex';
            
            compileTimeline();
            recordStartCycleIndex = 0; 

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `Perfect_16_9_Cinema_${Date.now()}.webm`;
                a.click();
                
                isRecording = false;
                recordingBadge.style.display = 'none';
                document.body.classList.remove('hide-ui');
                alert('🎉 完美 16:9 高清影片已自動下載！畫面比例已完美修正，絕不拉伸變形。');
            };

            mediaRecorder.start();
        });

        function stopRecordingAndDownload() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        playBtn.addEventListener('click', compileTimeline);
        parseUrlParams();
        resizeCanvas();
        compileTimeline();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
